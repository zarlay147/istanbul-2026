<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Istanbul</title>
<style>
:root{--bg:#1c1930;--card:#28233f;--ink:#f1ecf8;--mute:#aaa2c0;--teal:#72d6d0;--teal2:#1f3d42;--terra:#ffa58c;--terra2:#4a2c33;--gold:#f2c46d;--line:#3a3456;--lav:#a58cf0;--lav2:#352d55;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior:none}
html,body{margin:0;background:radial-gradient(ellipse at 80% -10%,rgba(231,155,181,.18),transparent 55%) no-repeat,radial-gradient(ellipse at 0% 0%,rgba(165,140,240,.22),transparent 50%) no-repeat,var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
#gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:calc(32px + env(safe-area-inset-top)) 24px calc(32px + env(safe-area-inset-bottom));background:radial-gradient(circle at 15% 15%,rgba(165,140,240,.45) 0,transparent 45%),radial-gradient(circle at 85% 30%,rgba(231,155,181,.35) 0,transparent 45%),radial-gradient(circle at 30% 90%,rgba(114,214,208,.28) 0,transparent 50%),#1c1930}
#gate .logo{width:88px;height:88px;border-radius:22px;margin-bottom:18px;box-shadow:0 8px 24px rgba(155,135,214,.35)}
#gate h1{color:#f6ecff;font:700 38px/1.1 "New York",Georgia,serif;margin:0 0 6px}
#gate p{color:var(--mute);margin:0 0 24px}
#gate input{width:100%;font-size:18px;padding:14px 16px;border-radius:16px;border:1px solid #4a4170;box-shadow:0 2px 10px rgba(0,0,0,.25);background:var(--card);color:var(--ink)}
#gate button{margin-top:12px;width:100%;font-size:17px;font-weight:600;padding:14px;border:0;border-radius:16px;background:linear-gradient(135deg,#a993e6,#e79bb5);color:#fff;box-shadow:0 6px 18px rgba(169,147,230,.4)}
#gate label{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--mute);font-size:15px}
#err{color:var(--terra);min-height:22px;margin-top:10px}
#tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:rgba(28,25,48,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;padding:7px 8px;border-radius:16px}
#tabs button small{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
#tabs button b{font-size:18px;line-height:1.1}
#tabs button.on small{color:#1c1930}
#tabs.hide{display:none}
body.notabs main{padding-top:calc(8px + env(safe-area-inset-top))}
#bnav{position:fixed;left:0;right:0;bottom:0;transform:translateZ(0);will-change:transform;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:rgba(21,18,38,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
#bnav button{border:0;background:none;color:var(--mute);font:600 11px/1.2 -apple-system,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
#bnav button span{font-size:22px;filter:grayscale(.6);opacity:.7}
#bnav button.on{color:var(--lav)}
#bnav button.on span{filter:none;opacity:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:16px 14px;font-family:inherit;min-height:130px}
.tile .ti{font-size:34px}.tile b{font-size:17px}.tile small{font-size:12.5px;color:var(--mute);line-height:1.3}
.tile.tsos{background:#3a1f2a;border-color:#5a2633}
.sheet .money-cat{margin:14px 0 6px;font-weight:700;color:var(--ink)}
.tile.trf{grid-column:1/-1;min-height:auto;flex-direction:row;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(169,147,230,.25),rgba(127,199,196,.2))}
#tabs button.on{background:var(--lav);border-color:var(--lav);color:#1c1930}
#tabs button.today:not(.on){border-color:var(--terra);color:var(--terra)}
main{min-height:100vh;min-height:100dvh;box-sizing:border-box;padding:4px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.day{display:none}.day.on{display:block}
h2{color:#f6ecff;font:700 26px/1.15 "New York",Georgia,serif;margin:18px 0 2px}
.sub{color:var(--mute);margin:0 0 12px}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:22px 0 8px}
.quote{margin:4px 0 14px;padding:12px 14px;border-left:3px solid var(--gold);background:var(--card);border-radius:0 14px 14px 0}.quote p{margin:0}.quote .tr{font:italic 17px/1.4 "New York",Georgia,serif}.quote .tk{margin-top:6px;font-size:13px;color:var(--mute);font-style:italic}.quote .au{margin-top:6px;font-size:12px;color:var(--gold);font-weight:600}
.mrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mlab{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.sw{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:999px;padding:4px 6px 4px 12px;font:700 12px/1 -apple-system,system-ui,sans-serif}
.sw:after{content:"";width:22px;height:22px;border-radius:50%;background:#6c6488;transition:all .2s}
.sw.on{background:linear-gradient(135deg,#a993e6,#7fc7c4);color:#1c1930;border-color:transparent}
.sw.on:after{background:#fff}
.live{font-size:15px}
.live:empty{display:none}
.live .upd{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.live.stale{opacity:.7}
.prev{color:var(--mute);font-size:14px}
.ck{float:right;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;margin:0 0 6px 10px;padding:0;position:relative;z-index:3;cursor:pointer;touch-action:manipulation}
.ck:after{content:"";position:absolute;inset:0;display:flex}
.done>.ck{background:linear-gradient(135deg,#a993e6,#7fc7c4);border-color:transparent}
.done>.ck:after{content:"✓";color:#1c1930;font:800 15px/24px -apple-system,system-ui,sans-serif;justify-content:center}
.steps li.done .what,.steps li.done .time,.resto.done>*:not(.ck),.gem.done>*:not(.ck){opacity:.55}
.steps li.done .what>div:first-child{text-decoration:line-through;text-decoration-color:rgba(165,140,240,.7)}
.bilan .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 10px}
.bilan .bar i{display:block;height:100%;background:linear-gradient(90deg,#a993e6,#7fc7c4)}
.bilan ul{margin:6px 0 0;padding-left:18px}.bilan li{margin:2px 0}
.bilan .ok{color:var(--teal)}.bilan .ko{color:var(--mute)}
.memo{width:100%;margin-top:10px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font:16px/1.4 -apple-system,system-ui,sans-serif;resize:vertical}
#upd{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:20;border:0;border-radius:16px;padding:14px;font:700 15px/1.2 -apple-system,system-ui,sans-serif;color:#1c1930;background:linear-gradient(135deg,#a993e6,#7fc7c4);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.prayers div.past{opacity:.45}
.prayers div.next{background:linear-gradient(135deg,#a993e6,#7fc7c4);color:#1c1930;box-shadow:0 0 12px rgba(165,140,240,.5)}
.prayers div.next span{color:#1c1930;font-weight:700}
.prayers div.next b{font-size:15px;font-weight:800}
.nextp{margin-top:8px;padding:10px 12px;border-radius:14px;background:var(--lav2);font-size:15px;text-align:center}
.nextp:empty{display:none}
.nextp b{color:var(--lav)}
.nextp.soon{background:var(--terra2)}.nextp.soon b{color:var(--terra)}
.sheet{position:fixed;inset:0;z-index:30;overflow-y:auto;background:#151226;padding:calc(56px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom))}
.sheet .close{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--ink);font-size:18px}
.shl{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 14px}
.big{font:800 34px/1.1 -apple-system,system-ui,sans-serif;color:#fff}
.bigaddr{font:700 24px/1.3 -apple-system,system-ui,sans-serif;color:#fff;margin-top:10px}
.hintr{font-size:19px;color:var(--gold);margin-top:8px}
.phr i.ph{display:block;font-style:normal;color:var(--gold);font-size:16px;margin:3px 0 4px;letter-spacing:.2px}
.phnote{font-size:13px;color:var(--mute);margin-top:12px;line-height:1.45}
#rfov{position:fixed;inset:0;z-index:9999;background:rgba(20,17,36,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
#rfov .box{background:var(--card);border-radius:22px;padding:26px 28px;text-align:center;min-width:230px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
#rfov .spin{width:46px;height:46px;margin:0 auto 14px;border-radius:50%;border:4px solid rgba(165,140,240,.25);border-top-color:var(--lav);animation:rfspin .8s linear infinite}
#rfov b{display:block;color:#fff;font-size:18px}#rfov small{display:block;color:var(--mute);margin-top:6px;font-size:14px}
@keyframes rfspin{to{transform:rotate(360deg)}}
#rftoast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);z-index:9998;background:#2f8f6a;color:#fff;padding:12px 18px;border-radius:16px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:90vw;text-align:center;transition:opacity .4s}
.jourj{background:linear-gradient(135deg,rgba(165,140,240,.22),rgba(114,214,208,.16));border:1px solid rgba(165,140,240,.4);border-radius:20px;padding:14px 14px 10px;margin:14px 0}
.jourj h3{margin:0 0 6px}.jjt{color:var(--gold);font-weight:700;margin:12px 0 4px}
.jj{position:relative;display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.jj .ck{position:relative;flex:0 0 auto;top:0;right:0;margin:0;border-color:rgba(165,140,240,.75);background:rgba(165,140,240,.08)}.jj span{flex:1;line-height:1.4}.jj.done span{opacity:.45;text-decoration:line-through}.jj.done .ck{background:linear-gradient(135deg,#a993e6,#7fc7c4);border-color:transparent}
.jourj .btn{margin-top:10px}
details.love{background:rgba(255,165,140,.12);border:1px dashed rgba(255,165,140,.5);border-radius:16px;padding:10px 14px;margin:12px 0}
details.love summary{cursor:pointer;font-weight:700;color:var(--terra);list-style:none}details.love summary::-webkit-details-marker{display:none}
details.love summary small{font-weight:400;color:var(--mute);margin-left:6px}details.love[open] summary small{display:none}
details.love p{margin:10px 0 2px;line-height:1.55;font-style:italic}
.take{background:var(--card);border-radius:14px;padding:10px 14px;margin:10px 0;line-height:1.45;font-size:15px}.take b{color:var(--teal)}
.planb{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);line-height:1.45}.planb b{color:var(--teal)}
.carnetbtn{margin:16px 0 4px}
#cn-body .cnh{text-align:center;margin:4px 0 14px}#cn-body .cnh b{display:block;font-size:22px;color:#fff}#cn-body .cnh span{color:var(--mute)}
#cn-body .cnd{background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0}
#cn-body .cnd h4{margin:0 0 4px;color:var(--lav)}#cn-body .cnd .t{color:var(--mute);font-size:14px;margin-bottom:6px}
#cn-body .cnd p{margin:4px 0;line-height:1.45}#cn-body .cnmemo{font-style:italic;color:#fff}
.cnbtns{display:grid;gap:10px;margin-top:14px}.btn.ghost{background:transparent;border:1px solid var(--lav);color:var(--lav)}
@media print{body{background:#fff!important}body *{visibility:hidden}#sh-carnet,#sh-carnet *{visibility:visible}
 #sh-carnet{position:absolute!important;inset:auto!important;left:0!important;top:0!important;width:100%;height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important;padding:0!important}
 #sh-carnet .noprint{display:none!important}#cn-body .cnd{background:#fff!important;border:1px solid #ccc;break-inside:avoid}#cn-body *{color:#000!important}}
.eve{background:linear-gradient(135deg,rgba(40,35,90,.9),rgba(20,17,48,.95));border:1px solid rgba(242,196,109,.45);border-radius:18px;padding:14px 16px;margin:16px 0;position:relative;overflow:hidden}
.eve::after{content:"✦ · ✧ · ✦";position:absolute;right:12px;top:10px;color:rgba(242,196,109,.35);font-size:12px;letter-spacing:2px}
.evh{font-weight:700;color:var(--gold)}.evs{color:var(--mute);margin-top:6px;font-size:15px;line-height:1.4}
.eve.open .evs{display:none}.eve button.evb{margin-top:10px;width:100%;padding:12px;border-radius:14px;border:1px solid var(--gold);background:rgba(242,196,109,.12);color:var(--gold);font:600 16px -apple-system,system-ui,sans-serif}
.evt{margin:10px 0 2px;font-style:italic;line-height:1.6;color:#fff}
.wcday{display:block;width:100%;text-align:left;margin:12px 0 4px;background:rgba(114,214,208,.08);border:1px solid rgba(114,214,208,.3);border-radius:14px;padding:10px 14px;color:var(--ink);font:15px/1.45 -apple-system,system-ui,sans-serif;cursor:pointer}.wcday b{color:var(--teal)}
ul.tips{padding-left:20px;line-height:1.5;margin:14px 0}ul.tips li{margin:6px 0}
.wclist div{background:var(--card);border-radius:12px;padding:9px 12px;margin:6px 0;line-height:1.45;font-size:15px}.wclist b{color:var(--lav)}
.lbox{background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0}.lbox b{color:var(--teal)}.lbox p{margin:6px 0 0;line-height:1.5}
.wx3{margin:4px 0 14px}.wx3 .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wx3 .d{background:var(--card);border-radius:14px;padding:10px 8px;text-align:center}.wx3 .d b{display:block;color:var(--lav);font-size:14px}.wx3 .d .i{font-size:26px;display:block;margin:4px 0}
.wx3 .d small{color:var(--mute);display:block}.wx3 .d.rain{border:1px solid rgba(114,214,208,.6)}.wx3 .msg{color:var(--mute);font-size:14px;line-height:1.45}
.wx3 .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.wx3 .hd span{font-weight:700;color:var(--gold)}
.grpnav{display:flex;gap:8px;overflow-x:auto;margin:6px 0 10px;padding-bottom:4px;scrollbar-width:none}.grpnav::-webkit-scrollbar{display:none}
.grpnav button{font-family:inherit;cursor:pointer;flex:0 0 auto;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;white-space:nowrap}
.grp{margin-top:22px;scroll-margin-top:20px}.grph{display:flex;align-items:center;gap:8px;font-size:19px;text-transform:none;letter-spacing:0;color:#fff}.grph small{background:var(--card);color:var(--mute);border-radius:999px;padding:2px 9px;font-size:13px}
.sublab{color:var(--gold);font-weight:700;margin:14px 0 4px;font-size:15px}
.phr{margin-top:18px;display:grid;gap:10px}
.phr div{background:var(--card);border-radius:16px;padding:12px 14px}
.phr b{display:block;font-size:22px;color:#fff}.phr span{font-size:14px;color:var(--mute)}
.cv{display:block;color:var(--mute);font-size:14px;margin-bottom:12px}
.cv input{display:block;width:100%;margin-top:6px;font:700 30px/1.2 -apple-system,system-ui,sans-serif;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:#fff}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 12px;font:600 14px -apple-system,system-ui,sans-serif}
.rate{color:var(--mute);font-size:13px;margin-top:14px}
.call{display:block;text-decoration:none;background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;color:var(--ink)}
.call b{display:block;font-size:15px}.call .num{display:block;font:800 26px/1.2 -apple-system,system-ui,sans-serif;color:#ff9f87;margin-top:4px}.call .sub2{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.pwarn{margin-top:6px;font-size:13.5px;line-height:1.35;color:#ffd08a;background:rgba(242,196,109,.12);border-radius:10px;padding:7px 9px}
.when{font-size:12.5px;color:var(--teal);margin-top:2px}
.expform{display:flex;gap:8px}
.expform input{flex:1;min-width:0;font:700 26px/1.2 -apple-system,system-ui,sans-serif;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:#fff}
.cur{display:flex;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cur button,.cats button{border:0;background:var(--card);color:var(--mute);font:700 15px -apple-system,system-ui,sans-serif;padding:0 14px}
.cur button.on{background:var(--lav);color:#1c1930}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.cats button{border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px}
.cats button.on{background:var(--lav2);color:#fff;border-color:var(--lav)}
#ex-note{width:100%;box-sizing:border-box;font:16px -apple-system,system-ui,sans-serif;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.extotal{margin:16px 0 6px;padding:14px;border-radius:16px;background:var(--lav2);font-size:15px}
.extotal b{font-size:22px;color:#fff}
.exday{margin-top:14px;font-weight:700;color:var(--ink);display:flex;justify-content:space-between}
.exitem{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin-top:6px;font-size:14.5px}
.exitem .t{flex:1}.exitem .a{font-weight:700;color:var(--terra);white-space:nowrap}
.exitem .del{border:0;background:none;color:var(--mute);font-size:16px;padding:4px}
.meteo{box-shadow:0 2px 12px rgba(0,0,0,.25);display:grid;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.prayers{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.prayers div{background:var(--lav2);border-radius:10px;padding:6px 2px;text-align:center}
.prayers span{display:block;font-size:11px;color:var(--mute)}
.prayers b{font-size:13px}
.steps{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.steps li{position:relative;padding:0 0 14px 16px}
.steps li:before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--teal);border:2px solid var(--bg);box-shadow:0 0 8px rgba(114,214,208,.6)}
.steps li.k-move:before{background:var(--mute)}
.steps li.k-food:before{background:var(--terra)}
.time{font-weight:700;font-size:14px;color:var(--teal);font-variant-numeric:tabular-nums}
.sprice{display:inline-block;margin-top:4px;font-size:13px;font-weight:600;background:var(--terra2);color:var(--terra);padding:2px 8px;border-radius:8px}
.links{display:flex;gap:14px;margin-top:6px;font-size:14px}
.links a{color:var(--teal);font-weight:600;text-decoration:none}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;vertical-align:1px;white-space:nowrap}
.t-friend{background:#4d3d14;color:#f2c46d}.t-ppt{background:var(--teal2);color:var(--teal)}.t-claude{background:var(--line);color:var(--mute)}

.resto{box-shadow:0 2px 12px rgba(0,0,0,.25);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:8px}
.resto.is-friend{border:2px solid var(--gold)}
.resto b.friend{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.star{font-size:13px;color:var(--gold);font-weight:700;white-space:nowrap}
.price{font-weight:700;color:var(--terra);margin-top:4px}
.dishes{font-size:14.5px;margin-top:4px;color:var(--ink)}
.cnt{font-size:12px;color:var(--mute);white-space:nowrap}
.resto.cafe{border-left:3px solid #c8a27a}
.note{font-size:14px;color:var(--mute);margin-top:2px}
.dessert{margin:4px 0 0;font-size:15px}
.box{box-shadow:0 2px 12px rgba(0,0,0,.25);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:10px;font-size:15px}
.reddit{border-left:4px solid #ff6a2b}.gem{border:2px solid #ff8a5b;background:linear-gradient(135deg,rgba(255,138,91,.14),var(--card))}
.legend{margin:8px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:13px}.legend b{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:#2b9aa0;color:#fff;font-size:10px;margin-right:5px}.legend b.h{background:#d9654c}
.map{width:100%;height:auto;display:block}
.mapbg{fill:#203a40}
.route{fill:none;stroke:#72d6d0;stroke-width:2.5;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.pin{fill:#2b9aa0;stroke:#1c1930;stroke-width:2}.pin.hotel{fill:var(--terra)}
.pinlab{fill:#fff;font:700 10px -apple-system,system-ui,sans-serif;text-anchor:middle}

.btn{display:block;width:100%;text-align:center;margin-top:10px;padding:13px;border-radius:16px;background:linear-gradient(135deg,#a993e6,#7fc7c4);color:#fff;font:600 16px/1.2 inherit;font-family:inherit;text-decoration:none;border:0}
.btn.alt{background:var(--card);color:var(--lav);border:1px solid var(--line)}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}
</style>
</head>

}

function getNotes(){try{return JSON.parse(load("ist_notes")||"{}")}catch(e){return {}}}
function paintDone(){
  var dn=getDone();
  document.querySelectorAll("[data-item]").forEach(function(el){el.classList.toggle("done",!!dn[el.dataset.item])});
  document.querySelectorAll("[data-bilan]").forEach(function(box){
    var sec=document.getElementById(box.dataset.bilan);
    var acts=[].slice.call(sec.querySelectorAll("li[data-item], .gem[data-item]"));
    var restos=[].slice.call(sec.querySelectorAll(".resto:not(.cafe)[data-item]"));var cafes=[].slice.call(sec.querySelectorAll(".resto.cafe[data-item]")).filter(function(x){return dn[x.dataset.item]}).map(function(x){return x.querySelector(".rhead b").textContent});
    var nd=acts.filter(function(x){return dn[x.dataset.item]}).length;
    var eat=restos.filter(function(x){return dn[x.dataset.item]}).map(function(x){return x.querySelector(".rhead b").textContent});
    var todo=acts.filter(function(x){return !dn[x.dataset.item]}).map(function(x){return x.dataset.label});
    var pct=acts.length?Math.round(100*nd/acts.length):0;
    var h="<b>"+nd+" / "+acts.length+" visites faites</b>"+'<div class="bar"><i style="width:'+pct+'%"></i></div>';
    h+='<div class="ok">🍽 '+(eat.length?"On a mangé chez : "+eat.join(", "):"Aucun restaurant coché")+"</div>";if(cafes.length)h+='<div class="ok">☕ Cafés : '+cafes.join(", ")+"</div>";
    if(todo.length)h+='<div class="ko" style="margin-top:6px">Pas (encore) fait :</div><ul class="ko">'+todo.map(function(t){return "<li>"+t+"</li>"}).join("")+"</ul>";
    else if(acts.length)h+='<div class="ok" style="margin-top:6px">🎉 Journée complète !</div>';
    box.innerHTML=h;
  });
}
function initDone(){
  var notes=getNotes();
  document.querySelectorAll("[data-note]").forEach(function(t){t.value=notes[t.dataset.note]||"";t.addEventListener("input",function(){var n=getNotes();n[t.dataset.note]=t.value;store("ist_notes",JSON.stringify(n))})});
  paintDone();
  document.getElementById("app").addEventListener("click",function(ev){var b=ev.target.closest("[data-ck]");if(!b)return;var dn=getDone(),k=b.dataset.ck;if(dn[k])delete dn[k];else dn[k]=1;store("ist_done",JSON.stringify(dn));paintDone()});
}

// Heure d'Istanbul (UTC+3 toute l'année), quel que soit le fuseau du téléphone
function istNow(){var t=window.__fakeNow?new Date(window.__fakeNow).getTime():Date.now();return new Date(t+3*3600000)}
function istDateStr(d){return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
function prayersOf(date){var g=document.querySelector('.prayers[data-pdate="'+date+'"]');if(!g)return null;
  return [].slice.call(g.children).map(function(c){var p=c.dataset.t.split(":");return {el:c,name:c.dataset.p,label:c.dataset.t.replace(":"," h "),min:+p[0]*60+ +p[1]}})}
function paintPrayers(){
  var n=istNow(),today=istDateStr(n),cur=n.getUTCHours()*60+n.getUTCMinutes()+n.getUTCSeconds()/60;
  document.querySelectorAll(".prayers div").forEach(function(c){c.classList.remove("next","past")});
  document.querySelectorAll(".nextp").forEach(function(x){x.innerHTML="";x.classList.remove("soon")});
  var ps=prayersOf(today);if(!ps)return;
  var nxt=null,inMin;
  ps.forEach(function(p){if(p.min<=cur)p.el.classList.add("past");else if(!nxt)nxt=p});
  if(nxt){inMin=nxt.min-cur}
  else{var tm=new Date(n.getTime()+86400000),ps2=prayersOf(istDateStr(tm));if(ps2){nxt=ps2[0];nxt.tomorrow=true;inMin=24*60-cur+nxt.min}}
  if(!nxt)return;
  nxt.el.classList.add("next");
  var m=Math.max(0,Math.ceil(inMin)),h=Math.floor(m/60),r=m%60;
  var d=h?(h+" h "+String(r).padStart(2,"0")+" min"):(r+" min");
  var box=document.querySelector('.nextp[data-nextp="'+today+'"]');
  if(box){box.innerHTML="🕌 Prochaine prière : <b>"+nxt.name+" à "+nxt.label+(nxt.tomorrow?" (demain)":"")+"</b> · dans <b>"+d+"</b>";box.classList.toggle("soon",m<=15)}
}
function initPrayers(){paintPrayers();setInterval(paintPrayers,30000);document.addEventListener("visibilitychange",function(){if(!document.hidden)paintPrayers()})}

function kbClose(){var a=document.activeElement;if(a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT")&&a.blur)a.blur()}
function openSheet(k){kbClose();document.querySelectorAll(".sheet").forEach(function(x){x.hidden=true});var s=document.getElementById("sh-"+k);if(s){s.hidden=false;s.scrollTop=0;if(k==="conv")paintRate();if(k==="exp")paintExp();if(k==="carnet")paintCarnet()}}
function rateInfo(){var r=null;try{r=JSON.parse(load("ist_rate")||"null")}catch(e){}return r||{v:56,t:0}}
function paintRate(){var r=rateInfo(),el=document.getElementById("cv-rate");if(!el)return;
  el.textContent="Taux utilisé : 1 € = "+r.v.toFixed(2).replace(".",",")+" TL"+(r.t?" (en direct, relevé le "+dm(r.t)+" à "+hm(r.t)+")":" (indicatif, novembre 2026 · touchez 🔄 Actualiser pour le mettre à jour)")}
function fmt(x,d){return x.toLocaleString("fr-FR",{maximumFractionDigits:d,minimumFractionDigits:d})}
function conv(from){var r=rateInfo().v,tl=document.getElementById("cv-tl"),eu=document.getElementById("cv-eur");
  if(from==="tl"){var v=parseFloat(tl.value);eu.value=isNaN(v)?"":(v/r).toFixed(2)}else{var w=parseFloat(eu.value);tl.value=isNaN(w)?"":Math.round(w*r)}}
async function fetchRate(force){if(!force&&!liveOn())return;try{var r=await fetch("https://open.er-api.com/v6/latest/EUR",{cache:"no-store"});if(!r.ok)return;var j=await r.json();if(j&&j.rates&&j.rates.TRY){store("ist_rate",JSON.stringify({v:j.rates.TRY,t:Date.now()}));paintRate()}}catch(e){}}
function initTools(){
  document.getElementById("app").addEventListener("click",function(ev){var b=ev.target.closest("[data-sheet]");if(b)openSheet(b.dataset.sheet)});
  document.getElementById("app").addEventListener("click",function(ev){if(ev.target.closest("[data-close]"))document.querySelectorAll(".sheet").forEach(function(x){x.hidden=true});
    var q=ev.target.closest("[data-tl]");if(q){document.getElementById("cv-tl").value=q.dataset.tl;conv("tl")}});
  var tl=document.getElementById("cv-tl"),eu=document.getElementById("cv-eur");
  if(tl){tl.addEventListener("input",function(){conv("tl")});eu.addEventListener("input",function(){conv("eur")})}
  fetchRate();
}


function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function carnetData(){
  var dn=getDone(),notes=getNotes(),ex=getExp(),r=rateV(),days=[];
  document.querySelectorAll("section.day[data-date]").forEach(function(sec){
    var id=sec.id,date=sec.dataset.date;
    var vis=[].slice.call(sec.querySelectorAll("li[data-item], .gem[data-item]")).filter(function(x){return dn[x.dataset.item]}).map(function(x){return x.dataset.label});
    var eat=[].slice.call(sec.querySelectorAll(".resto[data-item]")).filter(function(x){return dn[x.dataset.item]}).map(function(x){return x.querySelector(".rhead b").textContent});
    var tl=ex.filter(function(x){return x.day===date}).reduce(function(s,x){return s+tlOf(x)},0);
    days.push({id:id,date:sec.querySelector("h2").textContent,title:sec.querySelector(".sub").textContent,note:(notes[id]||"").trim(),vis:vis,eat:eat,tl:tl});
  });
  var tot=ex.reduce(function(s,x){return s+tlOf(x)},0);
  return {days:days,tot:tot,r:r,nvis:days.reduce(function(s,d){return s+d.vis.length},0),neat:days.reduce(function(s,d){return s+d.eat.length},0)};
}
function paintCarnet(){
  var c=carnetData(),h='<div class="cnh"><b>Istanbul · Abder & Imane</b><span>15 → 23 novembre 2026</span><br><span>'+c.nvis+' visites · '+c.neat+' restos et cafés · '+fmt(Math.round(c.tot),0)+' TL (≈ '+fmt(c.tot/c.r,0)+' €)</span></div>';
  c.days.forEach(function(d){
    h+='<div class="cnd" data-cn="'+d.id+'"><h4>'+esc(d.date)+'</h4><div class="t">'+esc(d.title)+'</div>';
    if(d.note)h+='<p class="cnmemo">« '+esc(d.note)+' »</p>';
    if(d.vis.length)h+='<p>📍 '+d.vis.map(esc).join(" · ")+'</p>';
    if(d.eat.length)h+='<p>🍽 '+d.eat.map(esc).join(" · ")+'</p>';
    if(d.tl)h+='<p>💰 '+fmt(Math.round(d.tl),0)+' TL (≈ '+fmt(d.tl/c.r,0)+' €)</p>';
    if(!d.note&&!d.vis.length&&!d.eat.length&&!d.tl)h+='<p class="t">Rien de noté pour l\'instant.</p>';
    h+='</div>'});
  document.getElementById("cn-body").innerHTML=h;
}
function carnetText(){
  var c=carnetData(),t="Istanbul · Abder & Imane · 15 → 23 novembre 2026\n\n";
  c.days.forEach(function(d){t+=d.date+" · "+d.title+"\n";if(d.note)t+="« "+d.note+" »\n";if(d.vis.length)t+="📍 "+d.vis.join(", ")+"\n";if(d.eat.length)t+="🍽 "+d.eat.join(", ")+"\n";if(d.tl)t+="💰 "+fmt(Math.round(d.tl),0)+" TL\n";t+="\n"});
  return t+"Total : "+fmt(Math.round(c.tot),0)+" TL (≈ "+fmt(c.tot/c.r,0)+" €)";
}
function initCarnet(){
  var p=document.getElementById("cn-pdf");if(!p)return;
  p.addEventListener("click",function(){paintCarnet();window.print()});
  document.getElementById("cn-share").addEventListener("click",function(){var t=carnetText();
    if(navigator.share){navigator.share({title:"Notre carnet d'Istanbul",text:t}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){var b=document.getElementById("cn-share");b.textContent="✅ Copié !";setTimeout(function(){b.textContent="📤 Partager le texte"},2000)})}});
}

// 🌙 Mot du soir : ne s'ouvre qu'à partir de 21 h 30 (heure d'Istanbul) le jour J
function eveOpenAt(date){return Date.parse(date+"T21:30:00+03:00")}
function nowMs(){return window.__fakeNow?new Date(window.__fakeNow).getTime():Date.now()}
function paintEve(){
  var n=nowMs();
  document.querySelectorAll(".eve[data-eve]").forEach(function(b){
    var at=eveOpenAt(b.dataset.eve),s=b.querySelector(".evs"),t=b.querySelector(".evt");
    if(n<at){
      b.classList.remove("open","ready");t.hidden=true;t.textContent="";var old=b.querySelector(".evb");if(old)old.remove();
      var mins=Math.ceil((at-n)/60000);
      s.textContent=mins<=24*60&&istDateStr(istNow())===b.dataset.eve
        ?"🔒 S'ouvre ce soir à 21 h 30 · dans "+(mins>=60?Math.floor(mins/60)+" h "+String(mins%60).padStart(2,"0"):mins+" min")
        :"🔒 S'ouvre le soir même, à 21 h 30 (heure d'Istanbul)";
    }else if(!b.classList.contains("open")&&!b.querySelector(".evb")){
      b.classList.add("ready");s.textContent="✨ C'est l'heure.";
      b.insertAdjacentHTML("beforeend",'<button type="button" class="evb">Ouvrir le mot du soir</button>');
    }
  });
}
function initGrp(){document.getElementById("app").addEventListener("click",function(ev){var b=ev.target.closest("[data-grp-go]");if(!b)return;var t=document.getElementById(b.dataset.grpGo);if(t)t.scrollIntoView({behavior:"smooth",block:"start"})})}
function initEve(){
  paintEve();setInterval(paintEve,30000);
  document.getElementById("app").addEventListener("click",function(ev){var btn=ev.target.closest(".evb");if(!btn)return;var b=btn.closest(".eve");
    if(nowMs()<eveOpenAt(b.dataset.eve)){paintEve();return}
    var t=b.querySelector(".evt");t.textContent=decodeURIComponent(escape(atob(b.dataset.m)));t.hidden=false;b.classList.add("open");btn.remove()});
  document.addEventListener("visibilitychange",function(){if(!document.hidden)paintEve()});
}
function getExp(){try{return JSON.parse(load("ist_exp")||"[]")}catch(e){return []}}
function rateV(){return rateInfo().v}
function tlOf(x){return x.cur==="EUR"?x.amt*rateV():x.amt}
function paintExp(){
  var L=getExp(),tot=L.reduce(function(s,x){return s+tlOf(x)},0),r=rateV();
  var T=document.getElementById("ex-total");if(!T)return;
  T.innerHTML="Total du séjour : <b>"+fmt(Math.round(tot),0)+" TL</b> · ≈ <b>"+fmt(tot/r,2)+" €</b><br><span class=\"hint\">"+L.length+" dépense"+(L.length>1?"s":"")+"</span>";
  var by={},order=[];L.forEach(function(x,i){if(!by[x.day]){by[x.day]=[];order.push(x.day)}by[x.day].push([x,i])});
  order.sort().reverse();
  var h="";order.forEach(function(d){var st=by[d].reduce(function(s,p){return s+tlOf(p[0])},0);
    var dd=new Date(d+"T12:00:00Z");var lab=dd.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});
    h+='<div class="exday"><span>'+lab+'</span><span>'+fmt(Math.round(st),0)+' TL · '+fmt(st/r,2)+' €</span></div>';
    by[d].slice().reverse().forEach(function(p){var x=p[0];h+='<div class="exitem"><span class="t">'+x.cat+(x.note?' · '+x.note.replace(/[<>&]/g,""):"")+'</span><span class="a">'+(x.cur==="EUR"?fmt(x.amt,2)+" €":fmt(x.amt,0)+" TL")+'</span><button type="button" class="del" data-del="'+p[1]+'" aria-label="Supprimer">✕</button></div>'})});
  document.getElementById("ex-list").innerHTML=h;
}
function initExp(){
  var sh=document.getElementById("sh-exp");if(!sh)return;
  sh.addEventListener("click",function(ev){
    var c=ev.target.closest("[data-cur]");if(c){sh.querySelectorAll("[data-cur]").forEach(function(b){b.classList.toggle("on",b===c)})}
    var k=ev.target.closest("[data-cat]");if(k){sh.querySelectorAll("[data-cat]").forEach(function(b){b.classList.toggle("on",b===k)})}
    var d=ev.target.closest("[data-del]");if(d){var L=getExp();L.splice(+d.dataset.del,1);store("ist_exp",JSON.stringify(L));paintExp()}
    if(ev.target.closest("#ex-add")){var a=parseFloat(document.getElementById("ex-amt").value);if(!(a>0))return;
      var L=getExp();L.push({amt:a,cur:sh.querySelector("[data-cur].on").dataset.cur,cat:sh.querySelector("[data-cat].on").dataset.cat,note:document.getElementById("ex-note").value.trim().slice(0,60),day:istDateStr(istNow())});
      store("ist_exp",JSON.stringify(L));document.getElementById("ex-amt").value="";document.getElementById("ex-note").value="";paintExp()}
  });
  paintExp();
}
function initLive(){
  paintLive();fetchWx();
  document.getElementById("app").addEventListener("click",function(ev){var b=ev.target.closest("[data-live-toggle]");if(!b)return;store("ist_live",liveOn()?"0":"1");paintLive();fetchWx();fetchRate()});
  document.addEventListener("visibilitychange",function(){if(!document.hidden){var w=null;try{w=JSON.parse(load("ist_wx")||"null")}catch(e){}if(!w||Date.now()-w.t>30*60000)fetchWx()}});
}

async function checkUpdate(){
  try{var r=await fetch("./?v="+Date.now(),{cache:"no-store"});if(!r.ok)return;var t=await r.text();var m=t.match(/var VER\x3d"([^"]+)"/);
    if(m&&m[1]!==VER&&!document.getElementById("upd")){document.body.insertAdjacentHTML("afterbegin",'<button id="upd" type="button">✨ Nouvelle version disponible : toucher pour actualiser</button>');document.getElementById("upd").onclick=hardReload}}catch(e){}
}
function rfShow(msg){var o=document.getElementById("rfov");if(!o){document.body.insertAdjacentHTML("beforeend",'<div id="rfov" role="status" aria-live="polite"><div class="box"><div class="spin"></div><b>Actualisation…</b><small id="rfmsg"></small></div></div>');o=document.getElementById("rfov")}document.getElementById("rfmsg").textContent=msg}
async function hardReload(){
  rfShow("💱 Taux de change du jour…");
  try{await Promise.race([fetchRate(true),new Promise(function(r){setTimeout(r,3000)})])}catch(e){}
  rfShow("✨ Téléchargement de la dernière version…");
  try{sessionStorage.setItem("ist_rf","1")}catch(e){}
  try{if(navigator.serviceWorker){var rs=await navigator.serviceWorker.getRegistrations();for(var i=0;i<rs.length;i++)await rs[i].unregister()}}catch(e){}
  try{if(window.caches){var ks=await caches.keys();for(var j=0;j<ks.length;j++)await caches.delete(ks[j])}}catch(e){}
  location.replace("./?v="+Date.now());
}
function rfDone(){var f=null;try{f=sessionStorage.getItem("ist_rf");sessionStorage.removeItem("ist_rf")}catch(e){}if(!f)return;
  var r=null;try{r=JSON.parse(localStorage.getItem("ist_rate")||"null")}catch(e){}
  document.body.insertAdjacentHTML("beforeend",'<div id="rftoast" role="status">✅ Appli à jour · version '+VER+(r&&r.v?' · 1 € = '+r.v.toFixed(2).replace(".",",")+' TL':'')+'</div>');
  setTimeout(function(){var t=document.getElementById("rftoast");if(t){t.style.opacity="0";setTimeout(function(){t.remove()},450)}},3500)}
(function waitApp(n){if(document.getElementById("bnav"))rfDone();else if(n<100)setTimeout(function(){waitApp(n+1)},100)})(0);
function openApp(u){window.location.href=u}
document.addEventListener("click",function(ev){var a=ev.target.closest&&ev.target.closest("a.ig[data-app]");if(!a)return;ev.preventDefault();
  var web=a.href,t=setTimeout(function(){if(!document.hidden)window.open(web,"_blank")},1400);
  document.addEventListener("visibilitychange",function h(){if(document.hidden){clearTimeout(t);document.removeEventListener("visibilitychange",h)}});
  openApp(a.getAttribute("data-app"))});
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkUpdate()});
checkUpdate();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(function(){})}
</script>
